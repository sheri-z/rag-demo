[project]
name = "rag-demo"
version = "0.1.0"
description = "RAG demo over annual reports, based on the Enterprise RAG Challenge winning approach"
readme = "README.md"
authors = [
    { name = "sheri-z", email = "zhangshilin0920@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.150.1",
    "faiss-cpu>=1.16.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.5",
    "openai>=3.52.0",
    "pydantic-settings>=2.16.3",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# prompt text is kept verbatim
"src/rag_demo/prompts.py" = ["E501"]
